# Started by the son dakika loop (bulut/calistir.ps1 $Plan) at its time; GitHub cron was hours late.
name: Sabah bülteni
on:
  workflow_dispatch:
    inputs:
      saat:
        description: 'Paylaşım saati (HH:mm, boş = hemen)'
        default: ''
concurrency: { group: bulten, cancel-in-progress: false }
jobs:
  bulten:
    uses: ./.github/workflows/_is.yml
    with:
      is: bulten
      saat: ${{ github.event_name == 'schedule' && '08:00' || inputs.saat }}
      medya: true
    secrets: inherit
