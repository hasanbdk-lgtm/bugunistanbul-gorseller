# Every 5 minutes: apply phone approvals, then poll breaking-news sources and send new drafts to the phone
name: Son dakika
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency: { group: sondakika, cancel-in-progress: false }
jobs:
  sondakika:
    uses: ./.github/workflows/_is.yml
    with:
      is: sondakika
    secrets: inherit
