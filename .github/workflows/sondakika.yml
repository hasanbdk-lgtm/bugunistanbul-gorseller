# Son dakika + the automation's clock: GitHub cron is late and sparse, so each run polls in a loop itself
# and starts the timed jobs (see bulut/calistir.ps1 $Plan). Each run loops ~170 minutes (apply phone approvals, poll sources, send new drafts,
# save state, every 5 minutes) and queues its successor 15 min before the end; the 3-hourly cron only restarts a broken chain.
name: Son dakika
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      dakika:
        description: 'Kaç dakika dönsün'
        default: '170'
concurrency: { group: sondakika, cancel-in-progress: false }
jobs:
  sondakika:
    uses: ./.github/workflows/_is.yml
    with:
      is: sondakika
      dakika: ${{ github.event_name == 'schedule' && 170 || fromJSON(inputs.dakika) }}
      sure: 200
    secrets: inherit
