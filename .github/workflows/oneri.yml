# Started by the son dakika loop (bulut/calistir.ps1 $Plan) at its time; GitHub cron was hours late.
name: Bugün ne yapsak
on:
  workflow_dispatch:
    inputs:
      saat:
        description: 'Paylaşım saati (HH:mm, boş = hemen)'
        default: ''
concurrency: { group: oneri, cancel-in-progress: false }
jobs:
  oneri:
    uses: ./.github/workflows/_is.yml
    with:
      is: oneri
      saat: ${{ github.event_name == 'schedule' && '11:00' || inputs.saat }}
      medya: true
    secrets: inherit
