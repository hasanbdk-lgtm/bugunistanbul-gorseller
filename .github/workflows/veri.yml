# 05:35 Istanbul (GitHub cron runs 30-50 min late): weather + planned power cuts into gun.json for the morning Claude routine
name: Sabah verisi
on:
  schedule:
    - cron: '35 2 * * *'
  workflow_dispatch:
jobs:
  veri:
    uses: ./.github/workflows/_is.yml
    with:
      is: veri
    secrets: inherit
