# @hergun1genel quote Reels at 08:30, 12:30 and 20:30 Istanbul. Started ~25 min early by the son dakika loop
# (bulut/calistir.ps1 $Plan) with vakit + saat; the job waits for the posting time itself.
name: Hergun1genel
on:
  workflow_dispatch:
    inputs:
      vakit:
        description: 'sabah | ogle | aksam'
        default: 'ogle'
      saat:
        description: 'Paylaşım saati (HH:mm, boş = hemen)'
        default: ''
concurrency: { group: hergun, cancel-in-progress: false }
jobs:
  hergun:
    uses: ./.github/workflows/_is.yml
    with:
      is: hergun
      vakit: ${{ inputs.vakit }}
      saat: ${{ inputs.saat }}
      medya: true
    secrets: inherit
