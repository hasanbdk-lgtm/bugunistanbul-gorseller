# 05:50 Istanbul (waits for gun.json): Claude writes today's bulletin texts, narration and the 11:00 recommendation
name: Sabah hazırlığı
on:
  schedule:
    - cron: '50 2 * * *'
  workflow_dispatch:
concurrency: { group: hazirlik, cancel-in-progress: false }
jobs:
  hazirlik:
    uses: ./.github/workflows/_claude.yml
    with:
      is: hazirlik
    secrets: inherit
