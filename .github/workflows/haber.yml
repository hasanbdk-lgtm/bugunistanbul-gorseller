# Started by the son dakika loop (bulut/calistir.ps1 $Plan) at its time; GitHub cron was hours late.
# Hourly 07:10–23:10 Istanbul: Claude turns news candidates into story drafts (skipped when there are none)
name: Haber taslakları
on:
  workflow_dispatch:
concurrency: { group: haber, cancel-in-progress: false }
jobs:
  haber:
    uses: ./.github/workflows/_claude.yml
    with:
      is: haber
    secrets: inherit
